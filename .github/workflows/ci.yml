name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint:levels
      - run: npm run build
      - name: absolute asset paths must not exist (blank page on subpath hosting)
        run: |
          if grep -qE 'src="/assets|href="/assets' dist/index.html; then
            echo 'ABSOLUTE ASSET PATH: rebuild with base: ./ (see vite.config.ts)'
            exit 1
          fi
